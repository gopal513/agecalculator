<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business Calculators — Aura Age</title>
<meta name="description" content="Free business calculators — GST, VAT, Sales Tax, Discount, Margin, Markup, Commission, CPC, CPM, Depreciation and more.">
<link rel="stylesheet" href="css/style.css">
<style>
.page-hero{text-align:center;padding:110px 20px 30px;max-width:800px;margin:0 auto}
.page-hero h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#EC4899,#F472B6,#FB923C);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradFlow 5s ease infinite}
.page-hero p{color:var(--text-muted);font-size:.95rem}
.calc-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px;margin:0 auto 2rem;padding:0 20px}
.calc-tab{padding:8px 16px;border-radius:50px;border:1.5px solid var(--card-border);background:var(--card-bg);color:var(--text-muted);font-size:.76rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.calc-tab:hover{border-color:rgba(236,72,153,.4);color:#F9A8D4;transform:translateY(-2px)}
.calc-tab.active{background:linear-gradient(135deg,rgba(236,72,153,.22),rgba(251,146,60,.12));border-color:rgba(236,72,153,.55);color:#F9A8D4;box-shadow:0 4px 18px rgba(236,72,153,.18)}
.calc-panel{display:none;max-width:680px;margin:0 auto;padding:0 20px 40px}
.calc-panel.active{display:block;animation:fadeUp .35s ease both}
.calc-card{backdrop-filter:blur(14px);background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:2rem 1.5rem;position:relative;overflow:hidden}
.calc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#EC4899,#FB923C,#FBBF24)}
.calc-card h2{font-size:1.3rem;font-weight:800;color:var(--text-color);margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.calc-card .sub{color:var(--text-muted);font-size:.82rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:12px;border:1.5px solid var(--input-border);background:var(--input-bg);color:var(--text-color);font-size:.95rem;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{border-color:#EC4899;box-shadow:0 0 0 3px rgba(236,72,153,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-calc{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#EC4899,#FB923C);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:all .3s;font-family:'Space Grotesk',sans-serif}
.btn-calc:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(236,72,153,.3)}
.result-box{margin-top:1.5rem;padding:1.25rem;border-radius:16px;background:rgba(236,72,153,.06);border:1px solid rgba(236,72,153,.18);display:none}
.result-box.show{display:block;animation:fadeUp .3s ease both}
.result-box .big-num{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;background:linear-gradient(135deg,#EC4899,#F472B6,#FB923C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:.5rem}
.result-box .detail{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85rem;color:var(--text-muted)}
.result-box .detail span:last-child{color:var(--text-color);font-weight:600}
.formula-box{margin-top:1rem;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.3);font-family:monospace;font-size:.75rem;color:rgba(255,255,255,.5);border-left:3px solid #EC4899;line-height:1.6}
.mode-toggle{display:flex;gap:6px;margin-bottom:1rem}
.mode-btn{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--card-border);background:transparent;color:var(--text-muted);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
.mode-btn.active{background:rgba(236,72,153,.15);color:#F9A8D4;border-color:rgba(236,72,153,.4)}
.dep-table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.78rem}
.dep-table th{color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.dep-table td{padding:6px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-color)}
.rating{display:inline-block;padding:3px 10px;border-radius:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.rating.excellent{background:rgba(52,211,153,.15);color:#34D399}
.rating.good{background:rgba(251,191,36,.15);color:#FBBF24}
.rating.poor{background:rgba(248,113,113,.15);color:#F87171}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media(max-width:500px){.row2{grid-template-columns:1fr}.calc-tab{font-size:.7rem;padding:6px 12px}}
</style>
</head>
<body>
<header class="site-header"><div class="nav-container">
<a href="index.html" class="logo-link"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 6V12L16 14M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs></svg><span class="logo-text">Aura Age</span></a>
<div class="nav-actions"><a href="index.html" class="nav-menu-link">Home</a></div>
</div></header>

<div class="page-hero"><h1>📊 Business Calculators</h1><p>GST, Tax, Margins, Advertising & Depreciation — free and instant.</p></div>

<div class="calc-tabs" id="tabs">
<button class="calc-tab active" data-t="gst">🏷️ GST</button>
<button class="calc-tab" data-t="vat">💶 VAT</button>
<button class="calc-tab" data-t="sales-tax">🧾 Sales Tax</button>
<button class="calc-tab" data-t="discount">🎁 Discount</button>
<button class="calc-tab" data-t="margin">📈 Margin</button>
<button class="calc-tab" data-t="markup">💲 Markup</button>
<button class="calc-tab" data-t="commission">🤝 Commission</button>
<button class="calc-tab" data-t="cpc">🖱️ CPC</button>
<button class="calc-tab" data-t="cpm">📺 CPM</button>
<button class="calc-tab" data-t="cash-ratio">🏧 Cash Ratio</button>
<button class="calc-tab" data-t="debt-ratio">⚖️ Debt Ratio</button>
<button class="calc-tab" data-t="depreciation">📉 Depreciation</button>
</div>
<div id="panels"></div>

<footer class="site-footer">
<div class="footer-nav">
<a href="index.html" class="footer-link">Home</a><a href="privacy-policy.html" class="footer-link">Privacy</a><a href="terms.html" class="footer-link">Terms</a><a href="disclaimer.html" class="footer-link">Disclaimer</a><a href="contact.html" class="footer-link">Contact</a>
</div>
<p class="footer-copy">&copy; 2026 Aura Age. All rights reserved.</p>
</footer>

<script>
const F=v=>parseFloat(v),fmt=n=>n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const CALCS=[
{id:'gst',icon:'🏷️',name:'GST Calculator',fields:[{id:'gst-a',label:'Amount (₹)',ph:'10000'},{id:'gst-r',label:'GST Rate',type:'select',opts:[['5','5%'],['12','12%'],['18','18%'],['28','28%']]},{id:'gst-m',label:'Mode',type:'select',opts:[['add','Add GST'],['remove','Remove GST']]}],
calc:f=>{const a=F(f[0]),r=F(f[1]),mode=f[2];
if(mode==='add'){const gst=a*r/100;const cgst=gst/2;return{big:'₹'+fmt(a+gst),details:[['Base Amount','₹'+fmt(a)],['GST ('+r+'%)','₹'+fmt(gst)],['CGST ('+r/2+'%)','₹'+fmt(cgst)],['SGST ('+r/2+'%)','₹'+fmt(cgst)],['Total','₹'+fmt(a+gst)]],formula:'GST = Amount × Rate / 100'};}
else{const base=a*100/(100+r);const gst=a-base;return{big:'₹'+fmt(base),details:[['Total (incl. GST)','₹'+fmt(a)],['Base Price','₹'+fmt(base)],['GST ('+r+'%)','₹'+fmt(gst)],['CGST','₹'+fmt(gst/2)],['SGST','₹'+fmt(gst/2)]],formula:'Base = Amount × 100 / (100 + Rate)'};}}},
{id:'vat',icon:'💶',name:'VAT Calculator',fields:[{id:'vat-a',label:'Amount (₹)',ph:'5000'},{id:'vat-r',label:'VAT Rate (%)',ph:'18'},{id:'vat-m',label:'Mode',type:'select',opts:[['add','Add VAT'],['remove','Remove VAT']]}],
calc:f=>{const a=F(f[0]),r=F(f[1]),m=f[2];
if(m==='add'){const vat=a*r/100;return{big:'₹'+fmt(a+vat),details:[['Net Price','₹'+fmt(a)],['VAT ('+r+'%)','₹'+fmt(vat)],['Gross Price','₹'+fmt(a+vat)]],formula:'VAT = Net × Rate / 100'};}
else{const net=a*100/(100+r);return{big:'₹'+fmt(net),details:[['Gross Price','₹'+fmt(a)],['Net Price','₹'+fmt(net)],['VAT','₹'+fmt(a-net)]],formula:'Net = Gross × 100 / (100+Rate)'};}}},
{id:'sales-tax',icon:'🧾',name:'Sales Tax',fields:[{id:'st-p',label:'Pre-tax Price (₹)',ph:'2000'},{id:'st-r',label:'Tax Rate (%)',ph:'8'}],
calc:f=>{const p=F(f[0]),r=F(f[1]);const tax=p*r/100;return{big:'₹'+fmt(p+tax),details:[['Pre-tax','₹'+fmt(p)],['Tax ('+r+'%)','₹'+fmt(tax)],['Total','₹'+fmt(p+tax)]],formula:'Tax = Price × Rate / 100'};}},
{id:'discount',icon:'🎁',name:'Discount Calculator',fields:[{id:'dis-p',label:'Original Price (₹)',ph:'5000'},{id:'dis-d',label:'Discount (%)',ph:'25'}],
calc:f=>{const p=F(f[0]),d=F(f[1]);const disc=p*d/100;return{big:'₹'+fmt(p-disc),details:[['Original','₹'+fmt(p)],['Discount ('+d+'%)','₹'+fmt(disc)],['You Pay','₹'+fmt(p-disc)],['You Save','₹'+fmt(disc)]],formula:'Discount = Price × Rate / 100'};}},
{id:'margin',icon:'📈',name:'Margin Calculator',fields:[{id:'mar-c',label:'Cost (₹)',ph:'800'},{id:'mar-r',label:'Revenue (₹)',ph:'1200'}],
calc:f=>{const c=F(f[0]),r=F(f[1]);const profit=r-c;const margin=(profit/r)*100;return{big:margin.toFixed(2)+'%',details:[['Cost','₹'+fmt(c)],['Revenue','₹'+fmt(r)],['Profit','₹'+fmt(profit)],['Gross Margin',margin.toFixed(2)+'%']],formula:'Margin = (Revenue - Cost) / Revenue × 100'};}},
{id:'markup',icon:'💲',name:'Markup Calculator',fields:[{id:'mkp-c',label:'Cost (₹)',ph:'800'},{id:'mkp-m',label:'Markup (%)',ph:'50'}],
calc:f=>{const c=F(f[0]),m=F(f[1]);const sell=c*(1+m/100);const profit=sell-c;const margin=(profit/sell)*100;return{big:'₹'+fmt(sell),details:[['Cost','₹'+fmt(c)],['Markup ('+m+'%)','₹'+fmt(profit)],['Selling Price','₹'+fmt(sell)],['Margin',margin.toFixed(2)+'%']],formula:'Sell = Cost × (1 + Markup/100)'};}},
{id:'commission',icon:'🤝',name:'Commission Calculator',fields:[{id:'com-s',label:'Sale Amount (₹)',ph:'100000'},{id:'com-r',label:'Commission Rate (%)',ph:'5'}],
calc:f=>{const s=F(f[0]),r=F(f[1]);const com=s*r/100;return{big:'₹'+fmt(com),details:[['Sale Amount','₹'+fmt(s)],['Commission ('+r+'%)','₹'+fmt(com)],['Net After Commission','₹'+fmt(s-com)]],formula:'Commission = Sale × Rate / 100'};}},
{id:'cpc',icon:'🖱️',name:'CPC Calculator',fields:[{id:'cpc-s',label:'Total Ad Spend (₹)',ph:'50000'},{id:'cpc-c',label:'Number of Clicks',ph:'2500'}],
calc:f=>{const s=F(f[0]),c=F(f[1]);const cpc=s/c;return{big:'₹'+cpc.toFixed(2),details:[['Total Spend','₹'+fmt(s)],['Clicks',c.toLocaleString()],['Cost Per Click','₹'+cpc.toFixed(2)]],formula:'CPC = Total Spend / Clicks'};}},
{id:'cpm',icon:'📺',name:'CPM Calculator',fields:[{id:'cpm-s',label:'Total Cost (₹)',ph:'25000'},{id:'cpm-i',label:'Impressions',ph:'500000'}],
calc:f=>{const s=F(f[0]),i=F(f[1]);const cpm=(s/i)*1000;return{big:'₹'+cpm.toFixed(2),details:[['Total Cost','₹'+fmt(s)],['Impressions',i.toLocaleString()],['CPM (per 1000)','₹'+cpm.toFixed(2)],['Cost per Impression','₹'+(s/i).toFixed(4)]],formula:'CPM = (Cost / Impressions) × 1000'};}},
{id:'cash-ratio',icon:'🏧',name:'Cash Ratio',fields:[{id:'cr-c',label:'Cash & Equivalents (₹)',ph:'500000'},{id:'cr-l',label:'Current Liabilities (₹)',ph:'400000'}],
calc:f=>{const c=F(f[0]),l=F(f[1]);const r=c/l;let cls='excellent',label='Excellent';if(r<0.5){cls='poor';label='Poor';}else if(r<1){cls='good';label='Good';}
return{big:r.toFixed(2),details:[['Cash','₹'+fmt(c)],['Liabilities','₹'+fmt(l)],['Cash Ratio',r.toFixed(2)],['Rating','<span class="rating '+cls+'">'+label+'</span>']],formula:'Cash Ratio = Cash / Current Liabilities'};}},
{id:'debt-ratio',icon:'⚖️',name:'Debt Ratio',fields:[{id:'dr-l',label:'Total Liabilities (₹)',ph:'3000000'},{id:'dr-a',label:'Total Assets (₹)',ph:'5000000'}],
calc:f=>{const l=F(f[0]),a=F(f[1]);const r=l/a;const pct=(r*100).toFixed(1);let cls='excellent',label='Low Risk';if(r>0.6){cls='poor';label='High Risk';}else if(r>0.4){cls='good';label='Moderate';}
return{big:pct+'%',details:[['Liabilities','₹'+fmt(l)],['Assets','₹'+fmt(a)],['Debt Ratio',r.toFixed(3)+' ('+pct+'%)'],['Rating','<span class="rating '+cls+'">'+label+'</span>']],formula:'Debt Ratio = Liabilities / Assets'};}},
{id:'depreciation',icon:'📉',name:'Straight Line Depreciation',fields:[{id:'dep-c',label:'Asset Cost (₹)',ph:'500000'},{id:'dep-s',label:'Salvage Value (₹)',ph:'50000'},{id:'dep-l',label:'Useful Life (years)',ph:'10'}],
calc:f=>{const c=F(f[0]),s=F(f[1]),l=F(f[2]);const annual=(c-s)/l;
let tableHTML='<table class="dep-table"><tr><th>Year</th><th>Depreciation</th><th>Book Value</th></tr>';
let bv=c;for(let i=1;i<=Math.min(l,15);i++){bv-=annual;tableHTML+='<tr><td>'+i+'</td><td>₹'+fmt(annual)+'</td><td>₹'+fmt(Math.max(bv,s))+'</td></tr>';}
tableHTML+='</table>';
return{big:'₹'+fmt(annual)+'/yr',details:[['Asset Cost','₹'+fmt(c)],['Salvage Value','₹'+fmt(s)],['Annual Depreciation','₹'+fmt(annual)],['Depreciable Amount','₹'+fmt(c-s)]],formula:'Annual = (Cost - Salvage) / Life'+tableHTML};}}
];

const panelsEl=document.getElementById('panels');
CALCS.forEach((c,i)=>{
let fieldsHTML='';
c.fields.forEach(f=>{
if(f.type==='select'){fieldsHTML+='<div class="field"><label>'+f.label+'</label><select id="'+f.id+'">';f.opts.forEach(o=>fieldsHTML+='<option value="'+o[0]+'">'+o[1]+'</option>');fieldsHTML+='</select></div>';}
else{fieldsHTML+='<div class="field"><label>'+f.label+'</label><input type="number" id="'+f.id+'" placeholder="'+f.ph+'"></div>';}
});
const div=document.createElement('div');div.className='calc-panel'+(i===0?' active':'');div.id='p-'+c.id;
div.innerHTML='<div class="calc-card"><h2>'+c.icon+' '+c.name+'</h2><div class="sub">Enter values and calculate</div>'+fieldsHTML+'<button class="btn-calc" id="btn-'+c.id+'">Calculate</button><div class="result-box" id="res-'+c.id+'"></div></div>';
panelsEl.appendChild(div);
});

document.querySelectorAll('.calc-tab').forEach(t=>{t.addEventListener('click',()=>{
document.querySelectorAll('.calc-tab').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.calc-panel').forEach(x=>x.classList.remove('active'));
t.classList.add('active');document.getElementById('p-'+t.dataset.t).classList.add('active');});});

function activateHash(){const h=location.hash.replace('#','');if(!h)return;const t=document.querySelector('.calc-tab[data-t="'+h+'"]');if(t)t.click();}
activateHash();window.addEventListener('hashchange',activateHash);

CALCS.forEach(c=>{document.getElementById('btn-'+c.id).addEventListener('click',()=>{
const vals=c.fields.map(f=>document.getElementById(f.id).value);
try{const r=c.calc(vals);let h='<div class="big-num">'+r.big+'</div>';
r.details.forEach(d=>h+='<div class="detail"><span>'+d[0]+'</span><span>'+d[1]+'</span></div>');
h+='<div class="formula-box">'+r.formula+'</div>';
const box=document.getElementById('res-'+c.id);box.innerHTML=h;box.classList.add('show');}catch(e){}});});
</script>
</body>
</html>
