<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Financial Calculators — Aura Age</title>
<meta name="description" content="Free financial calculators — Simple Interest, Compound Interest, APY, CAGR, ROI, Mortgage, Savings, Net Worth and more.">
<link rel="stylesheet" href="css/style.css">
<style>
.page-hero{text-align:center;padding:110px 20px 30px;max-width:800px;margin:0 auto}
.page-hero h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#C084FC,#F472B6,#FB923C);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradFlow 5s ease infinite}
.page-hero p{color:var(--text-muted);font-size:.95rem}
.calc-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px;margin:0 auto 2rem;padding:0 20px}
.calc-tab{padding:8px 18px;border-radius:50px;border:1.5px solid var(--card-border);background:var(--card-bg);color:var(--text-muted);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.calc-tab:hover{border-color:rgba(168,85,247,.4);color:#C4B5FD;transform:translateY(-2px)}
.calc-tab.active{background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(6,182,212,.12));border-color:rgba(168,85,247,.55);color:#C4B5FD;box-shadow:0 4px 18px rgba(168,85,247,.18)}
.calc-panel{display:none;max-width:680px;margin:0 auto;padding:0 20px 40px}
.calc-panel.active{display:block;animation:fadeUp .35s ease both}
.calc-card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:2rem 1.5rem;position:relative;overflow:hidden}
.calc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a855f7,#ec4899,#06b6d4)}
.calc-card h2{font-size:1.3rem;font-weight:800;color:var(--text-color);margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.calc-card .sub{color:var(--text-muted);font-size:.82rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:12px;border:1.5px solid var(--input-border);background:var(--input-bg);color:var(--text-color);font-size:.95rem;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{border-color:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.field select{cursor:pointer;-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-calc{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#a855f7,#06b6d4);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:all .3s;font-family:'Space Grotesk',sans-serif}
.btn-calc:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(168,85,247,.3)}
.result-box{margin-top:1.5rem;padding:1.25rem;border-radius:16px;background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.18);display:none}
.result-box.show{display:block;animation:fadeUp .3s ease both}
.result-box .big-num{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;background:linear-gradient(135deg,#C084FC,#F472B6,#FB923C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:.5rem}
.result-box .detail{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85rem;color:var(--text-muted)}
.result-box .detail span:last-child{color:var(--text-color);font-weight:600}
.formula-box{margin-top:1rem;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.3);font-family:monospace;font-size:.75rem;color:rgba(255,255,255,.5);border-left:3px solid #a855f7;line-height:1.6}
.rating{display:inline-block;padding:3px 10px;border-radius:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.rating.excellent{background:rgba(52,211,153,.15);color:#34D399}
.rating.good{background:rgba(251,191,36,.15);color:#FBBF24}
.rating.fair{background:rgba(251,146,60,.15);color:#FB923C}
.rating.poor{background:rgba(248,113,113,.15);color:#F87171}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:500px){.row2{grid-template-columns:1fr}.calc-tab{font-size:.72rem;padding:7px 14px}}
</style>
</head>
<body>
<header class="site-header"><div class="nav-container">
<a href="index.html" class="logo-link"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 6V12L16 14M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs></svg><span class="logo-text">Aura Age</span></a>
<div class="nav-actions"><a href="index.html" class="nav-menu-link">Home</a></div>
</div></header>

<div class="page-hero">
<h1>💰 Financial Calculators</h1>
<p>Investment, Loans, Savings & more — all free, instant, and beautiful.</p>
</div>

<div class="calc-tabs" id="tabs"></div>
<div id="panels"></div>

<footer class="site-footer">
<div class="footer-nav">
<a href="index.html" class="footer-link">Home</a><a href="privacy-policy.html" class="footer-link">Privacy</a><a href="terms.html" class="footer-link">Terms</a><a href="disclaimer.html" class="footer-link">Disclaimer</a><a href="contact.html" class="footer-link">Contact</a>
</div>
<p class="footer-copy">&copy; 2026 Aura Age. All rights reserved.</p>
</footer>

<script>
const F=v=>parseFloat(v),fmt=n=>n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const CALCS=[
{id:'simple-interest',icon:'💹',name:'Simple Interest',fields:[
{id:'si-p',label:'Principal (₹)',ph:'100000'},{id:'si-r',label:'Rate (% / year)',ph:'8'},{id:'si-t',label:'Time (years)',ph:'5'}],
calc:f=>{const P=F(f[0]),R=F(f[1]),T=F(f[2]);const SI=P*R*T/100;return{big:'₹'+fmt(SI),details:[['Principal','₹'+fmt(P)],['Interest','₹'+fmt(SI)],['Total Amount','₹'+fmt(P+SI)]],formula:'SI = (P × R × T) / 100 = ('+fmt(P)+' × '+R+' × '+T+') / 100'};}},
{id:'compound-interest',icon:'📈',name:'Compound Interest',fields:[
{id:'ci-p',label:'Principal (₹)',ph:'100000'},{id:'ci-r',label:'Rate (% / year)',ph:'8'},{id:'ci-t',label:'Time (years)',ph:'5'},
{id:'ci-n',label:'Compounding',ph:'',type:'select',opts:[['1','Annually'],['2','Semi-Annually'],['4','Quarterly'],['12','Monthly'],['365','Daily']]}],
calc:f=>{const P=F(f[0]),r=F(f[1])/100,t=F(f[2]),n=F(f[3]);const A=P*Math.pow(1+r/n,n*t);const CI=A-P;return{big:'₹'+fmt(CI),details:[['Principal','₹'+fmt(P)],['CI Earned','₹'+fmt(CI)],['Total Amount','₹'+fmt(A)]],formula:'A = P(1 + r/n)^(nt) = '+fmt(P)+'(1 + '+r.toFixed(4)+'/'+n+')^('+n+'×'+t+')'};}},
{id:'apy',icon:'📊',name:'APY Calculator',fields:[
{id:'apy-r',label:'Annual Interest Rate (%)',ph:'5'},
{id:'apy-n',label:'Compounding',ph:'',type:'select',opts:[['1','Annually'],['2','Semi-Annually'],['4','Quarterly'],['12','Monthly'],['365','Daily']]}],
calc:f=>{const r=F(f[0])/100,n=F(f[1]);const apy=(Math.pow(1+r/n,n)-1)*100;return{big:apy.toFixed(4)+'%',details:[['Nominal Rate',F(f[0])+'%'],['APY',apy.toFixed(4)+'%'],['Effective Gain per ₹1000','₹'+fmt(apy*10)]],formula:'APY = (1 + r/n)^n - 1 = (1 + '+(r/n).toFixed(6)+')^'+n+' - 1'};}},
{id:'cagr',icon:'🚀',name:'CAGR Calculator',fields:[
{id:'cagr-s',label:'Beginning Value (₹)',ph:'100000'},{id:'cagr-e',label:'Ending Value (₹)',ph:'200000'},{id:'cagr-t',label:'Number of Years',ph:'5'}],
calc:f=>{const s=F(f[0]),e=F(f[1]),t=F(f[2]);const cagr=(Math.pow(e/s,1/t)-1)*100;const growth=((e-s)/s)*100;return{big:cagr.toFixed(2)+'%',details:[['Beginning','₹'+fmt(s)],['Ending','₹'+fmt(e)],['CAGR',cagr.toFixed(2)+'%'],['Total Growth',growth.toFixed(1)+'%']],formula:'CAGR = (End/Start)^(1/n) - 1 = ('+(e/s).toFixed(4)+')^(1/'+t+') - 1'};}},
{id:'roi',icon:'💎',name:'ROI Calculator',fields:[
{id:'roi-i',label:'Initial Investment (₹)',ph:'50000'},{id:'roi-f',label:'Final Value (₹)',ph:'72000'}],
calc:f=>{const i=F(f[0]),fv=F(f[1]);const roi=((fv-i)/i)*100;const net=fv-i;return{big:roi.toFixed(2)+'%',details:[['Investment','₹'+fmt(i)],['Final Value','₹'+fmt(fv)],[net>=0?'Net Profit':'Net Loss','₹'+fmt(Math.abs(net))]],formula:'ROI = (FV - II) / II × 100 = ('+(fv-i).toFixed(0)+' / '+i.toFixed(0)+') × 100'};}},
{id:'rule72',icon:'⏱️',name:'Rule of 72',fields:[
{id:'r72-r',label:'Annual Interest Rate (%)',ph:'8'}],
calc:f=>{const r=F(f[0]);const y2=72/r;const y3=114/r;return{big:y2.toFixed(1)+' years',details:[['Rate',r+'%'],['Years to Double (72/r)',y2.toFixed(1)+' yrs'],['Years to Triple (114/r)',y3.toFixed(1)+' yrs']],formula:'Years to Double = 72 / Rate = 72 / '+r};}},
{id:'net-worth',icon:'🏦',name:'Net Worth',fields:[
{id:'nw-a',label:'Total Assets (₹)',ph:'5000000'},{id:'nw-l',label:'Total Liabilities (₹)',ph:'1500000'}],
calc:f=>{const a=F(f[0]),l=F(f[1]);const nw=a-l;return{big:(nw>=0?'':'−')+'₹'+fmt(Math.abs(nw)),details:[['Assets','₹'+fmt(a)],['Liabilities','₹'+fmt(l)],['Net Worth',(nw>=0?'₹':'−₹')+fmt(Math.abs(nw))]],formula:'Net Worth = Assets - Liabilities = '+fmt(a)+' - '+fmt(l)};}},
{id:'present-value',icon:'⏪',name:'Present Value',fields:[
{id:'pv-fv',label:'Future Value (₹)',ph:'500000'},{id:'pv-r',label:'Discount Rate (% / yr)',ph:'8'},{id:'pv-n',label:'Years',ph:'10'}],
calc:f=>{const fv=F(f[0]),r=F(f[1])/100,n=F(f[2]);const pv=fv/Math.pow(1+r,n);return{big:'₹'+fmt(pv),details:[['Future Value','₹'+fmt(fv)],['Present Value','₹'+fmt(pv)],['Discount',fmt(((fv-pv)/fv)*100)+'%']],formula:'PV = FV / (1 + r)^n = '+fmt(fv)+' / (1+'+r+')^'+n};}},
{id:'savings',icon:'🐖',name:'Savings Calculator',fields:[
{id:'sv-m',label:'Monthly Savings (₹)',ph:'10000'},{id:'sv-r',label:'Annual Rate (%)',ph:'7'},{id:'sv-t',label:'Years',ph:'10'}],
calc:f=>{const pmt=F(f[0]),r=F(f[1])/100/12,n=F(f[2])*12;const fv=r>0?pmt*((Math.pow(1+r,n)-1)/r)*(1+r):pmt*n;const tot=pmt*n;return{big:'₹'+fmt(fv),details:[['Monthly Savings','₹'+fmt(pmt)],['Total Deposited','₹'+fmt(tot)],['Interest Earned','₹'+fmt(fv-tot)],['Final Balance','₹'+fmt(fv)]],formula:'FV = PMT × ((1+r)^n - 1) / r × (1+r)'};}},
{id:'mortgage',icon:'🏠',name:'Mortgage Calculator',fields:[
{id:'mt-p',label:'Loan Amount (₹)',ph:'5000000'},{id:'mt-r',label:'Annual Rate (%)',ph:'8.5'},{id:'mt-t',label:'Loan Term (years)',ph:'20'}],
calc:f=>{const P=F(f[0]),r=F(f[1])/100/12,n=F(f[2])*12;const emi=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);const tot=emi*n;return{big:'₹'+fmt(emi)+'/mo',details:[['Loan Amount','₹'+fmt(P)],['Monthly EMI','₹'+fmt(emi)],['Total Payment','₹'+fmt(tot)],['Total Interest','₹'+fmt(tot-P)]],formula:'EMI = P × r(1+r)^n / ((1+r)^n - 1)'};}},
{id:'auto-loan',icon:'🚗',name:'Auto Loan',fields:[
{id:'al-p',label:'Car Price (₹)',ph:'800000'},{id:'al-d',label:'Down Payment (₹)',ph:'200000'},{id:'al-r',label:'Annual Rate (%)',ph:'9'},{id:'al-t',label:'Loan Term (months)',ph:'60'}],
calc:f=>{const price=F(f[0]),down=F(f[1]),r=F(f[2])/100/12,n=F(f[3]);const P=price-down;const emi=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);const tot=emi*n;return{big:'₹'+fmt(emi)+'/mo',details:[['Loan Amount','₹'+fmt(P)],['Monthly EMI','₹'+fmt(emi)],['Total Cost','₹'+fmt(tot+down)],['Total Interest','₹'+fmt(tot-P)]],formula:'Loan = Price - Down = ₹'+fmt(P)};}},
{id:'dti',icon:'📋',name:'DTI Calculator',fields:[
{id:'dti-d',label:'Monthly Debt Payments (₹)',ph:'25000'},{id:'dti-i',label:'Gross Monthly Income (₹)',ph:'80000'}],
calc:f=>{const d=F(f[0]),i=F(f[1]);const dti=(d/i)*100;let rate='excellent',cls='excellent';if(dti>=50){rate='Poor';cls='poor';}else if(dti>=35){rate='Fair';cls='fair';}else if(dti>=20){rate='Good';cls='good';}else{rate='Excellent';cls='excellent';}
return{big:dti.toFixed(1)+'%',details:[['Monthly Debt','₹'+fmt(d)],['Monthly Income','₹'+fmt(i)],['DTI Ratio',dti.toFixed(1)+'%'],['Rating','<span class="rating '+cls+'">'+rate+'</span>']],formula:'DTI = (Monthly Debt / Gross Income) × 100'};}},
{id:'loan-affordability',icon:'🔑',name:'Loan Affordability',fields:[
{id:'la-i',label:'Monthly Income (₹)',ph:'80000'},{id:'la-e',label:'Monthly Expenses (₹)',ph:'35000'},{id:'la-r',label:'Annual Rate (%)',ph:'9'},{id:'la-t',label:'Loan Term (years)',ph:'20'}],
calc:f=>{const inc=F(f[0]),exp=F(f[1]),r=F(f[2])/100/12,n=F(f[3])*12;const maxEMI=(inc-exp)*0.4;const maxLoan=maxEMI*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n));return{big:'₹'+fmt(maxLoan),details:[['Net Income','₹'+fmt(inc-exp)],['Max EMI (40% of Net)','₹'+fmt(maxEMI)],['Max Loan Amount','₹'+fmt(maxLoan)]],formula:'Max EMI = 40% of (Income - Expenses)'};}},
{id:'rental-yield',icon:'🏢',name:'Rental Yield',fields:[
{id:'ry-v',label:'Property Value (₹)',ph:'5000000'},{id:'ry-r',label:'Monthly Rent (₹)',ph:'20000'},{id:'ry-e',label:'Annual Expenses (₹)',ph:'30000'}],
calc:f=>{const v=F(f[0]),r=F(f[1]),e=F(f[2])||0;const annual=r*12;const gross=(annual/v)*100;const net=((annual-e)/v)*100;return{big:gross.toFixed(2)+'%',details:[['Annual Rent','₹'+fmt(annual)],['Gross Yield',gross.toFixed(2)+'%'],['Net Yield',net.toFixed(2)+'%']],formula:'Gross Yield = (Annual Rent / Property Value) × 100'};}},
{id:'discount',icon:'🏷️',name:'Discount Calculator',fields:[
{id:'dc-p',label:'Original Price (₹)',ph:'5000'},{id:'dc-d',label:'Discount (%)',ph:'20'}],
calc:f=>{const p=F(f[0]),d=F(f[1]);const disc=p*d/100;const final_=p-disc;return{big:'₹'+fmt(final_),details:[['Original','₹'+fmt(p)],['Discount ('+d+'%)','₹'+fmt(disc)],['You Pay','₹'+fmt(final_)],['You Save','₹'+fmt(disc)]],formula:'Discount = Price × Rate / 100 = '+fmt(p)+' × '+d+' / 100'};}}
];

const tabsEl=document.getElementById('tabs'),panelsEl=document.getElementById('panels');
CALCS.forEach((c,i)=>{
const tab=document.createElement('button');
tab.className='calc-tab'+(i===0?' active':'');
tab.dataset.idx=i;
tab.textContent=c.icon+' '+c.name;
tab.id='tab-'+c.id;
tabsEl.appendChild(tab);

let fieldsHTML='';
c.fields.forEach(f=>{
if(f.type==='select'){
fieldsHTML+='<div class="field"><label>'+f.label+'</label><select id="'+f.id+'">';
f.opts.forEach(o=>fieldsHTML+='<option value="'+o[0]+'">'+o[1]+'</option>');
fieldsHTML+='</select></div>';
}else{
fieldsHTML+='<div class="field"><label>'+f.label+'</label><input type="number" id="'+f.id+'" placeholder="'+f.ph+'"></div>';
}
});

const panel=document.createElement('div');
panel.className='calc-panel'+(i===0?' active':'');
panel.id='panel-'+c.id;
panel.innerHTML='<div class="calc-card"><h2>'+c.icon+' '+c.name+'</h2><div class="sub">Enter values below and hit Calculate</div>'+fieldsHTML+'<button class="btn-calc" id="btn-'+c.id+'">Calculate '+c.name+'</button><div class="result-box" id="res-'+c.id+'"></div></div>';
panelsEl.appendChild(panel);
});

// Tab switching
document.querySelectorAll('.calc-tab').forEach(tab=>{
tab.addEventListener('click',()=>{
document.querySelectorAll('.calc-tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.calc-panel').forEach(p=>p.classList.remove('active'));
tab.classList.add('active');
document.getElementById('panel-'+CALCS[tab.dataset.idx].id).classList.add('active');
});
});

// Hash-based deep linking
function activateHash(){
const h=location.hash.replace('#','');
if(!h)return;
const idx=CALCS.findIndex(c=>c.id===h);
if(idx>=0){
document.querySelectorAll('.calc-tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.calc-panel').forEach(p=>p.classList.remove('active'));
document.getElementById('tab-'+h).classList.add('active');
document.getElementById('panel-'+h).classList.add('active');
}
}
activateHash();
window.addEventListener('hashchange',activateHash);

// Calculate buttons
CALCS.forEach(c=>{
document.getElementById('btn-'+c.id).addEventListener('click',()=>{
const vals=c.fields.map(f=>document.getElementById(f.id).value);
if(vals.some(v=>!v||isNaN(parseFloat(v))&&!c.fields.find(x=>x.type==='select'))){return;}
try{
const r=c.calc(vals);
let html='<div class="big-num">'+r.big+'</div>';
r.details.forEach(d=>html+='<div class="detail"><span>'+d[0]+'</span><span>'+d[1]+'</span></div>');
html+='<div class="formula-box">'+r.formula+'</div>';
const box=document.getElementById('res-'+c.id);
box.innerHTML=html;box.classList.add('show');
}catch(e){}
});
});
</script>
</body>
</html>
